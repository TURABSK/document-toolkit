<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Scanner & PDF Maker - Pragati Telecom</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- html2pdf Library for generating PDF with Bengali font support -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #059669;
            --primary-hover: #047857;
            --bg-color: #f0fdf4;
            --glass-bg: #ffffff;
            --text-main: #1e293b;
        }

        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--glass-bg);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px dashed #e2e8f0;
            padding-bottom: 15px;
        }

        .header h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }
        .header p { margin: 5px 0 0 0; font-size: 0.9rem; color: #64748b; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }

        input[type="password"], input[type="file"] {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-size: 1rem; box-sizing: border-box;
        }

        button {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 24px; border-radius: 8px; font-size: 1rem;
            font-weight: 600; cursor: pointer; transition: 0.3s; width: 100%;
            margin-bottom: 10px;
        }
        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: #94a3b8; cursor: not-allowed; }
        
        .btn-pdf { background-color: #dc2626; }
        .btn-pdf:hover { background-color: #b91c1c; }

        .result-box { display: none; margin-top: 25px; }

        .editor-area {
            background: #fff; min-height: 250px; border: 1px solid #cbd5e1;
            border-radius: 8px; padding: 20px; font-size: 1.05rem;
            line-height: 1.6; white-space: pre-wrap;
        }

        .file-status {
            font-size: 0.9rem; color: #2563eb; margin-top: 10px; font-weight: 600; display: none;
        }

        .loader { display: none; text-align: center; margin: 20px 0; color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🧠 AI PDF & Image Scanner</h1>
            <p>যেকোনো ছবি (JPG/PNG) বা PDF ফাইল আপলোড করে ভিতরের টেক্সট বের করুন এবং নতুন PDF তৈরি করুন।</p>
        </div>

        <div class="form-group">
            <label>🔑 Gemini API Key:</label>
            <input type="password" id="apiKey" placeholder="আপনার API Key এখানে পেস্ট করুন...">
        </div>

        <div class="form-group">
            <!-- এখানে PDF সাপোর্ট যুক্ত করা হয়েছে -->
            <label>📄 স্ক্যান করা ছবি বা PDF আপলোড করুন:</label>
            <input type="file" id="fileInput" accept="image/png, image/jpeg, application/pdf">
            <div id="fileStatus" class="file-status">✅ ফাইল লোড হয়েছে!</div>
        </div>

        <button id="generateBtn" onclick="extractText()">✨ ফাইল থেকে টেক্সট বের করুন</button>
        
        <div class="loader" id="loader">Gemini আপনার ফাইলটি পড়ছে... একটু অপেক্ষা করুন ⏳</div>

        <div class="result-box" id="resultBox">
            <label>📝 এক্সট্রাক্ট করা টেক্সট (১০০% নির্ভুল):</label>
            <div id="outputContent" class="editor-area" contenteditable="true"></div>
            
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button onclick="copyText()" style="background-color: #3b82f6; flex: 1;">📋 কপি করুন</button>
                <button onclick="downloadPDF()" class="btn-pdf" style="flex: 1;">🖨️ PDF হিসেবে সেভ করুন</button>
            </div>
        </div>
    </div>

    <script>
        let base64Data = "";
        let fileMimeType = "";

        // ফাইল সিলেক্ট করার পর সেটিকে Base64 এ কনভার্ট করা
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const statusDiv = document.getElementById('fileStatus');
            
            if (file) {
                fileMimeType = file.type;
                const reader = new FileReader();
                reader.onload = function(readerEvent) {
                    // Base64 স্ট্রিং থেকে 'data:image/jpeg;base64,' অংশটুকু বাদ দেওয়া
                    const result = readerEvent.target.result;
                    base64Data = result.split(',')[1];
                    
                    statusDiv.style.display = 'block';
                    statusDiv.innerText = `✅ ${file.name} রেডি হয়েছে!`;
                };
                reader.readAsDataURL(file); // PDF বা ছবি সবকিছুর জন্যই কাজ করবে
            }
        });

        async function extractText() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('fileInput');
            const resultBox = document.getElementById('resultBox');
            const outputContent = document.getElementById('outputContent');
            const loader = document.getElementById('loader');
            const generateBtn = document.getElementById('generateBtn');

            if (!apiKey) {
                alert("দয়া করে আপনার Gemini API Key দিন!");
                return;
            }
            if (!base64Data) {
                alert("দয়া করে একটি ফাইল (ছবি বা PDF) আপলোড করুন!");
                return;
            }

            generateBtn.disabled = true;
            loader.style.display = 'block';
            resultBox.style.display = 'none';

            // Gemini-কে দেওয়া নির্দেশ (Prompt)
            const systemPrompt = "Extract all the text from this document exactly as it appears. Maintain the language (Bengali or English). Do not add any extra formatting, just the plain text.";

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: systemPrompt },
                                {
                                    inline_data: {
                                        mime_type: fileMimeType,
                                        data: base64Data
                                    }
                                }
                            ]
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error("API Key ভুল অথবা ফাইলের সাইজ খুব বড়।");
                }

                const data = await response.json();
                let aiText = data.candidates[0].content.parts[0].text;
                
                outputContent.innerText = aiText;
                resultBox.style.display = 'block';

            } catch (error) {
                alert("❌ এরর: " + error.message);
                console.error(error);
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
            }
        }

        // কপি করার ফাংশন
        function copyText() {
            const text = document.getElementById('outputContent').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert("টেক্সট কপি করা হয়েছে!");
            });
        }

        // PDF বানানোর ফাংশন (html2pdf লাইব্রেরি ব্যবহার করে)
        function downloadPDF() {
            const element = document.getElementById('outputContent');
            const opt = {
                margin:       0.5,
                filename:     'Extracted_Document.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'A4', orientation: 'portrait' }
            };

            // PDF তৈরি এবং ডাউনলোড শুরু
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
